name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # daily, picks up Fedora and COPR updates
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "44"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image variables
        run: |
          name=${GITHUB_REPOSITORY#*/}
          echo "IMAGE_NAME=${name,,}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "DATE_TAG=${FEDORA_VERSION}.$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          sudo podman build --pull=newer \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "localhost/${IMAGE_NAME}:build" .

      # Split the image into content-based layers so unchanged files are not
      # re-downloaded on every update.
      - name: Rechunk
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            "quay.io/fedora/fedora-bootc:${FEDORA_VERSION}" \
            /usr/libexec/bootc-base-imagectl rechunk \
            "localhost/${IMAGE_NAME}:build" "localhost/${IMAGE_NAME}:final"

      - name: Verify
        run: |
          label=$(sudo podman inspect --format '{{ index .Labels "containers.bootc" }}' "localhost/${IMAGE_NAME}:final")
          test "$label" = 1 || { echo "containers.bootc label missing after rechunk" >&2; exit 1; }
          sudo podman run --rm "localhost/${IMAGE_NAME}:final" bootc container lint

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          : > /tmp/refs
          for tag in "${DATE_TAG}" "${FEDORA_VERSION}" latest; do
            sudo podman push --digestfile "/tmp/digest-${tag}" \
              "localhost/${IMAGE_NAME}:final" "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
            echo "${IMAGE_REGISTRY}/${IMAGE_NAME}@$(sudo cat "/tmp/digest-${tag}")" >> /tmp/refs
          done
          sort -u /tmp/refs

      # Stay on cosign v2: containers/image (used by bootc) verifies the
      # classic .sig attachment format, and cosign v3 defaults to the new
      # bundle format.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name != 'pull_request'
        with:
          cosign-release: "v2.6.5"

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          sort -u /tmp/refs | while read -r ref; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          done
