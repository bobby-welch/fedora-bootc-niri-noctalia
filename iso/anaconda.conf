# Anaconda settings for this installer, read after Fedora's profile.
# Installed to /etc/anaconda/conf.d/; see anaconda.conf in the anaconda package.

[Bootloader]
# Kernel arguments come only from the image's kargs.d. By default Anaconda
# copies some installer arguments to the installed system, such as nomodeset
# from the basic graphics entry.
preserved_arguments =

[User Interface]
# The install is offline, but Anaconda's bootc source always asks for a
# network, so this screen blocks Begin Installation on a machine with no
# network device. Fedora Workstation hides it too; set the hostname after
# the first boot.
hidden_spokes =
    NetworkSpoke
