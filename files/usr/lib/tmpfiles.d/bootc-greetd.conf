# bootc doesn't update /var after install, so create greetd's state here.
# Named bootc-greetd.conf to avoid shadowing Fedora's own greetd files.
d /var/lib/greetd                      0750 greetd greetd -
d /var/lib/greetd/.config              0755 greetd greetd -
d /var/lib/greetd/.config/systemd      0755 greetd greetd -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd -

# The greeter has no desktop session, so don't start a portal for it.
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# tuigreet's --remember state.
d /var/cache/tuigreet 0755 greetd greetd -
